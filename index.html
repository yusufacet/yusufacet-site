<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yusuf Acet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Yusuf Acet, politologue (ULB). Recherche sur le comportement électoral, parcours et contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column with a margin rail for dates; hemicycle of seats as the page's signature. */
:root {
  --paper: #f5f6f3;
  --surface: #ebeee9;
  --ink: #18222d;
  --muted: #5a6670;
  --line: #d3d9d4;
  --accent: #1d5c78;
  --seat: #c99a3a;
  --seat-dim: #d9ddd7;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121820; --surface: #1a222c; --ink: #e6e9e4; --muted: #9aa6ae;
    --line: #2c3742; --accent: #7cb8d4; --seat: #dcb15a; --seat-dim: #2c3742;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121820; --surface: #1a222c; --ink: #e6e9e4; --muted: #9aa6ae;
  --line: #2c3742; --accent: #7cb8d4; --seat: #dcb15a; --seat-dim: #2c3742;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 1.0625rem; line-height: 1.65;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
.wrap {
  max-width: 46rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 2rem 4rem;
  display: flex; flex-direction: column; gap: 3.5rem;
}
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }

/* Top bar */
.topbar { display: flex; justify-content: flex-end; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; }
.lang button {
  font: 500 .75rem var(--mono); letter-spacing: .08em; color: var(--muted);
  background: transparent; border: 0; border-radius: 99px; padding: .3rem .75rem; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }

/* Header */
header { display: grid; gap: 1.25rem; margin-top: -1.5rem; }
.ident { display: flex; align-items: flex-end; gap: 1.5rem; flex-wrap: wrap; }
.hemi { width: 100%; max-width: 15rem; height: auto; display: block; }
.photo {
  width: 8.5rem; height: 8.5rem; border-radius: 50%; object-fit: cover; display: block;
  border: 3px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
}
h1 {
  font-family: var(--display); font-weight: 700; font-size: clamp(2.6rem, 8vw, 3.75rem);
  line-height: 1; letter-spacing: -0.02em; margin: 0; text-wrap: balance;
}
.role { font-family: var(--display); font-weight: 500; font-size: 1.2rem; color: var(--accent); margin: 0; }
.bio { margin: 0; max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; font-family: var(--mono); font-size: .8125rem; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: .6rem; }
.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  font: 500 .9rem var(--display); text-decoration: none;
  border: 1px solid var(--accent); border-radius: 4px; padding: .45rem .95rem; color: var(--accent); background: transparent;
}
.btn.primary { background: var(--accent); color: var(--paper); }
.btn:hover { filter: brightness(1.08); }

/* Sections */
section { display: grid; gap: 1.25rem; }
h2 {
  font-family: var(--mono); font-weight: 500; font-size: .75rem; text-transform: uppercase;
  letter-spacing: .14em; color: var(--muted); margin: 0;
  padding-bottom: .6rem; border-bottom: 1px solid var(--line);
}

/* Publications */
.pubs { display: grid; gap: 1rem; }
.pub { background: var(--surface); border-radius: 6px; padding: 1.75rem; display: grid; gap: .9rem; }
.pub + .pub { background: transparent; border: 1px solid var(--line); }
.kicker { font-family: var(--mono); font-size: .8125rem; color: var(--muted); margin: 0; }
.pub h3 {
  font-family: var(--display); font-weight: 700; font-size: clamp(1.4rem, 4vw, 1.75rem);
  line-height: 1.2; margin: 0; text-wrap: balance;
}
.pub + .pub h3 { font-size: 1.25rem; }
.pub p { margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: .5rem; list-style: none; margin: 0; padding: 0; }
.tags li { font-family: var(--mono); font-size: .75rem; border: 1px solid var(--line); border-radius: 99px; padding: .2rem .7rem; color: var(--muted); }
.pub-links { display: flex; flex-wrap: wrap; gap: 1rem; font-family: var(--display); font-weight: 500; font-size: .95rem; }

/* Timeline entries */
.entries { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.4rem; }
.entry { display: grid; grid-template-columns: 9.5rem 1fr; gap: 1.25rem; }
.when { font-family: var(--mono); font-size: .8125rem; color: var(--muted); padding-top: .2rem; font-variant-numeric: tabular-nums; }
.what { min-width: 0; }
.what strong { font-family: var(--display); font-weight: 500; font-size: 1.1rem; display: block; line-height: 1.35; }
.where { color: var(--accent); font-size: .95rem; }
.what p { margin: .25rem 0 0; color: var(--muted); font-size: .97rem; }
.now { display: inline-block; margin-left: .4rem; font-family: var(--mono); font-size: .6875rem; text-transform: uppercase; letter-spacing: .1em; color: var(--paper); background: var(--accent); border-radius: 3px; padding: .05rem .4rem; vertical-align: .15em; }

/* Skills */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; }
.facts h3 { font-family: var(--display); font-weight: 500; font-size: 1.05rem; margin: 0 0 .5rem; }
.facts ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; }
.lvl { font-family: var(--mono); font-size: .8125rem; color: var(--muted); margin-left: .35rem; }

/* Contact */
.contact { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; }
.mail { font-family: var(--mono); font-size: 1rem; user-select: all; word-break: break-all; }
.copy {
  font: 500 .875rem var(--display); color: var(--accent); background: transparent;
  border: 1px solid var(--accent); border-radius: 4px; padding: .4rem .9rem; cursor: pointer;
}
.copy:hover { background: var(--surface); }
.links { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; list-style: none; margin: 0; padding: 0; font-family: var(--display); font-weight: 500; }
footer { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.error { font-family: var(--mono); font-size: .875rem; color: var(--muted); }

@media (max-width: 560px) {
  .wrap { padding-block: 1.5rem 3rem; gap: 2.75rem; }
  .entry { grid-template-columns: 1fr; gap: .2rem; }
  .facts { grid-template-columns: 1fr; }
  .pub { padding: 1.25rem; }
  .photo { width: 7rem; height: 7rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" id="lang-fr" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <header>
    <div class="ident">
      <img class="photo" id="photo" alt="" hidden>
      <svg class="hemi" id="hemi" viewBox="0 0 240 128" aria-hidden="true"></svg>
    </div>
    <h1 id="nom">Yusuf Acet</h1>
    <p class="role" id="titre"></p>
    <p class="bio" id="bio"></p>
    <div class="meta"><span id="ville"></span><span id="langues-court"></span></div>
    <div class="actions" id="actions"></div>
  </header>

  <section id="sec-pubs" aria-labelledby="h-pubs">
    <h2 id="h-pubs" data-t="recherche"></h2>
    <div class="pubs" id="pubs"></div>
  </section>

  <section aria-labelledby="h-form">
    <h2 id="h-form" data-t="formation"></h2>
    <ol class="entries" id="formation"></ol>
  </section>

  <section aria-labelledby="h-exp">
    <h2 id="h-exp" data-t="experience"></h2>
    <ol class="entries" id="experience"></ol>
  </section>

  <section aria-labelledby="h-comp">
    <h2 id="h-comp" data-t="competences_langues"></h2>
    <div class="facts">
      <div><h3 data-t="competences"></h3><ul id="competences"></ul></div>
      <div><h3 data-t="langues"></h3><ul id="langues"></ul></div>
    </div>
  </section>

  <section aria-labelledby="h-contact">
    <h2 id="h-contact" data-t="contact"></h2>
    <div class="contact">
      <span class="mail" id="mail"></span>
      <button class="copy" id="copy" type="button" data-t="copier"></button>
    </div>
    <ul class="links" id="liens"></ul>
  </section>

  <footer id="footer"></footer>
</div>

<script>
(function () {
  var UI = {
    fr: { recherche: "Recherche", formation: "Formation", experience: "Expérience",
          competences_langues: "Compétences et langues", competences: "Compétences", langues: "Langues",
          contact: "Contact", copier: "Copier l'adresse", copie: "Adresse copiée", selection: "Adresse sélectionnée",
          actuel: "Actuel", cv: "Télécharger mon CV (PDF)", pdf: "Lire le PDF", lien: "Voir en ligne",
          erreur: "Le contenu du site n'a pas pu être chargé." },
    en: { recherche: "Research", formation: "Education", experience: "Experience",
          competences_langues: "Skills and languages", competences: "Skills", langues: "Languages",
          contact: "Contact", copier: "Copy address", copie: "Address copied", selection: "Address selected",
          actuel: "Current", cv: "Download my CV (PDF)", pdf: "Read the PDF", lien: "View online",
          erreur: "The site content could not be loaded." }
  };
  var data = null;
  var lang = "fr";

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null && text !== "") n.textContent = text;
    return n;
  }
  function pick(obj, key) {
    var v = obj[key + "_" + lang];
    if (v == null || v === "" || (Array.isArray(v) && !v.length)) v = obj[key + "_fr"];
    return v == null ? "" : v;
  }
  function safeUrl(u) {
    if (!u) return "";
    u = String(u).trim();
    if (/^https?:\/\//i.test(u)) return u;                 // lien complet
    if (/^\/(?!\/)/.test(u) || /^uploads\//i.test(u)) return u; // fichier du site
    if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/|$)/i.test(u)) return "https://" + u; // linkedin.com/in/...
    return "";
  }
  function link(href, text, cls) {
    var a = el("a", cls, text);
    a.href = href;
    if (/^https?:/i.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
    return a;
  }

  function render() {
    if (!data) return;
    var t = UI[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function (n) { n.textContent = t[n.getAttribute("data-t")]; });
    ["fr", "en"].forEach(function (l) { $("lang-" + l).setAttribute("aria-pressed", String(l === lang)); });

    $("nom").textContent = data.nom || "";
    document.title = data.nom || "Yusuf Acet";
    $("titre").textContent = pick(data, "titre");
    $("bio").textContent = pick(data, "bio");
    $("ville").textContent = pick(data, "ville");
    $("langues-court").textContent = (data.langues || []).map(function (l) {
      var iso = { french: "FR", english: "EN", german: "DE", dutch: "NL", turkish: "TR", spanish: "ES", italian: "IT", arabic: "AR", portuguese: "PT" };
      var en = (l.en || l.fr || "").trim();
      return iso[en.toLowerCase()] || en.slice(0, 2).toUpperCase();
    }).join(" · ");

    var photo = safeUrl(data.photo);
    $("photo").hidden = !photo;
    $("hemi").style.display = photo ? "none" : "";
    if (photo) { $("photo").src = photo; $("photo").alt = data.nom || ""; }

    var actions = $("actions"); actions.textContent = "";
    var cv = safeUrl(data.cv_pdf);
    if (cv) actions.appendChild(link(cv, t.cv, "btn primary"));

    // Publications
    var pubs = $("pubs"); pubs.textContent = "";
    (data.publications || []).forEach(function (p) {
      var art = el("article", "pub");
      var kick = [pick(p, "type"), p.institution, p.annee].filter(Boolean).join(" · ");
      if (kick) art.appendChild(el("p", "kicker", kick));
      art.appendChild(el("h3", null, pick(p, "titre")));
      var res = pick(p, "resume"); if (res) art.appendChild(el("p", null, res));
      var tags = pick(p, "mots_cles");
      if (Array.isArray(tags) && tags.length) {
        var ul = el("ul", "tags");
        tags.forEach(function (k) { if (k) ul.appendChild(el("li", null, k)); });
        art.appendChild(ul);
      }
      var f = safeUrl(p.fichier), l = safeUrl(p.lien);
      if (f || l) {
        var pl = el("div", "pub-links");
        if (f) pl.appendChild(link(f, t.pdf));
        if (l) pl.appendChild(link(l, t.lien));
        art.appendChild(pl);
      }
      pubs.appendChild(art);
    });
    $("sec-pubs").hidden = !(data.publications || []).length;

    // Formation
    var fo = $("formation"); fo.textContent = "";
    (data.formation || []).forEach(function (e) {
      fo.appendChild(entry(e.dates || pick(e, "dates"), pick(e, "titre"), e.lieu, pick(e, "details"), false));
    });
    // Expérience
    var ex = $("experience"); ex.textContent = "";
    (data.experience || []).forEach(function (e) {
      ex.appendChild(entry(pick(e, "dates") || e.dates, pick(e, "titre"), e.lieu, pick(e, "details"), !!e.actuel));
    });

    // Compétences / langues
    var co = $("competences"); co.textContent = "";
    (data.competences || []).forEach(function (c) { co.appendChild(el("li", null, c[lang] || c.fr)); });
    var la = $("langues"); la.textContent = "";
    (data.langues || []).forEach(function (l) {
      var li = el("li", null, l[lang] || l.fr);
      var niv = pick(l, "niveau"); if (niv) li.appendChild(el("span", "lvl", niv));
      la.appendChild(li);
    });

    // Contact
    $("mail").textContent = data.email || "";
    var li = $("liens"); li.textContent = "";
    (data.liens || []).forEach(function (k) {
      var u = safeUrl(k.url);
      if (u && k.nom) { var item = el("li"); item.appendChild(link(u, k.nom)); li.appendChild(item); }
    });
    $("footer").textContent = "© " + new Date().getFullYear() + " " + (data.nom || "");
  }

  function entry(when, title, where, details, now) {
    var li = el("li", "entry");
    li.appendChild(el("div", "when", when));
    var w = el("div", "what");
    var s = el("strong", null, title);
    if (now) s.appendChild(el("span", "now", UI[lang].actuel));
    w.appendChild(s);
    if (where) w.appendChild(el("span", "where", where));
    if (details) w.appendChild(el("p", null, details));
    li.appendChild(w);
    return li;
  }

  function setLang(l) {
    lang = l === "en" ? "en" : "fr";
    try { localStorage.setItem("lang", lang); } catch (e) {}
    render();
  }
  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
  });

  // Langue de départ : #en dans l'adresse, sinon dernier choix du visiteur, sinon français
  var start = "";
  try { start = localStorage.getItem("lang") || ""; } catch (e) { start = ""; }
  if (location.hash === "#en") start = "en";
  else if (location.hash === "#fr") start = "fr";
  lang = start === "en" ? "en" : "fr";

  // Hémicycle
  (function () {
    var svg = $("hemi"), NS = "http://www.w3.org/2000/svg", cx = 120, cy = 120, seats = [];
    for (var r = 0; r < 5; r++) {
      var radius = 48 + r * 15, n = Math.round(Math.PI * radius / 12);
      for (var i = 0; i < n; i++) {
        var a = Math.PI - (Math.PI * i) / (n - 1);
        seats.push({ x: cx + radius * Math.cos(a), y: cy - radius * Math.sin(a), a: a });
      }
    }
    seats.sort(function (p, q) { return q.a - p.a; });
    var lit = Math.round(seats.length * 0.38);
    seats.forEach(function (s, k) {
      var c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", s.x.toFixed(1)); c.setAttribute("cy", s.y.toFixed(1)); c.setAttribute("r", "4.2");
      c.setAttribute("fill", k < lit ? "var(--seat)" : (k < lit + 6 ? "var(--accent)" : "var(--seat-dim)"));
      svg.appendChild(c);
    });
  })();

  // Copier l'adresse e-mail
  $("copy").addEventListener("click", function () {
    var btn = this, mail = $("mail");
    var done = function () { btn.textContent = UI[lang].copie; setTimeout(function () { btn.textContent = UI[lang].copier; }, 2000); };
    var fallback = function () {
      var range = document.createRange(); range.selectNodeContents(mail);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      btn.textContent = UI[lang].selection;
    };
    try { navigator.clipboard.writeText(mail.textContent).then(done, fallback); } catch (e) { fallback(); }
  });

  fetch("content/site.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { data = d; render(); })
    .catch(function () {
      var p = el("p", "error", UI[lang].erreur);
      document.querySelector("header").appendChild(p);
    });
})();
</script>
</body>
</html>
